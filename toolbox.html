<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>lbp — toolbox</title>
<script src="analytics.js"></script>
<script src="gate.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fdfdfd;
    --check-a: #fdfdfd;
    --check-b: #efefef;
    --check: 11px;      /* taille d'une case du damier */
    --trame: 720px;     /* largeur d'UNE occurrence de la trame (assets/trame.svg) */
    --trame-x: -30px;   /* décalage : la trame dépasse en haut à gauche */
    --trame-y: -20px;
    --ink: #0f0f0f;
    --line: rgba(15, 15, 15, 0.14);
    --ease: cubic-bezier(0.77, 0, 0.175, 1);
  }

  html, body { cursor: none; }

  body {
    background-color: var(--check-a);
    background-image:
      url('assets/trame.svg?v=3'),
      conic-gradient(var(--check-b) 25%, var(--check-a) 0 50%, var(--check-b) 0 75%, var(--check-a) 0);
    /* une seule trame par bloc de 2×2 : vide autour (haut/bas/gauche/droite ET diagonales) de la taille du SVG */
    background-size:
      calc(var(--trame) * 2) auto,
      calc(var(--check) * 2) calc(var(--check) * 2);
    background-position:
      var(--trame-x) var(--trame-y),
      0 0;
    background-repeat: repeat, repeat;
    color: var(--ink);
    font-family: 'Piazzolla', serif;
    min-height: 100vh;
    user-select: none;
  }

  /* ── Curseur main (PNG) ── */
  #cursor {
    position: fixed;
    top: 0; left: 0;
    width: 32px;
    height: auto;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-5px, -1px);
    will-change: left, top;
  }

    /* ── Sélection "Photoshop" : tracé pointillé noir/blanc animé (fourmis) ──
       --ant = longueur d'un tiret (px) ; --ant-speed = durée d'un cycle            */
    :root { --ant: 4px; --ant-speed: 0.4s; }

    /* Le rond qui suit la souris : même effet, se morphe sur l'élément survolé */
    #ring {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      overflow: visible;
    }
    #ring rect { fill: none; stroke-width: 1; stroke-dasharray: var(--ant) var(--ant); }
    #ring .rb { stroke: #0f0f0f; animation: march var(--ant-speed) linear infinite; }
    #ring .rw { stroke: #fff; stroke-dashoffset: var(--ant); animation: march-w var(--ant-speed) linear infinite; }

    /* Contour exact d'un SVG (logo) : calque de tracés clonés, visible au survol */
    .ants { opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
    .ants-on .ants { opacity: 1; }
    .ants * {
      fill: none;
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;   /* 1px et tirets constants quelle que soit la taille du logo */
      stroke-dasharray: var(--ant) var(--ant);
    }
    .ants .ab { stroke: #0f0f0f; animation: march var(--ant-speed) linear infinite; }
    .ants .aw { stroke: #fff; stroke-dashoffset: var(--ant); animation: march-w var(--ant-speed) linear infinite; }

    @keyframes march   { to { stroke-dashoffset: calc(var(--ant) * -2); } }
    @keyframes march-w { to { stroke-dashoffset: calc(var(--ant) * -1); } }

    @media (prefers-reduced-motion: reduce) {
      #ring .rb, #ring .rw, .ants .ab, .ants .aw { animation: none; }
    }


  /* ── Lien retour (haut droite) ── */
  .back-link {
    position: fixed;
    top: clamp(1rem, 2.5vw, 1.8rem);
    right: clamp(1rem, 2.5vw, 1.8rem);
    z-index: 10;
    font-size: clamp(0.6rem, 1vw, 0.72rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    font-style: italic;
    color: var(--ink);
    cursor: none;
    padding: 0.5em 0;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.5s ease forwards 1.2s;
  }
  .back-link::after, .tool .name::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--ink);
    transition: width 0.3s ease;
  }
  .back-link:hover::after, .back-link:focus-visible::after { width: 100%; }

  /* ── En-tête ── */
  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(4rem, 9vw, 7rem) clamp(1.2rem, 4vw, 3rem) 4rem;
  }

  .label {
    font-size: clamp(0.6rem, 1vw, 0.72rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-style: italic;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .title-wrap { overflow: hidden; margin: 1.4rem 0 1.6rem; }
  .title {
    font-size: clamp(3rem, 11vw, 8rem);
    font-weight: 400;
    letter-spacing: -0.065em;
    line-height: 1;
    display: inline-block;   /* la boîte épouse le texte : le cadre pointillé aussi */
    vertical-align: top;
    clip-path: inset(0 100% 0 0);
    animation: wipe 0.9s var(--ease) forwards 0.5s;
  }

  .rule {
    width: 0;
    height: 1px;
    background: var(--ink);
    margin-bottom: clamp(2rem, 5vw, 3.5rem);
    animation: expand 0.6s ease forwards 1.1s;
  }

  /* ── Grille ── */
  .grid {
    display: grid;
    gap: clamp(1.8rem, 3.5vw, 2.8rem) clamp(1.2rem, 2.5vw, 2rem);
    grid-template-columns: repeat(4, 1fr);
  }

  a.tool {
    display: block;
    align-self: start;   /* la carte épouse son contenu : le cadre pointillé aussi */
    color: var(--ink);
    text-decoration: none;
    cursor: none;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.6s ease forwards;
    animation-delay: calc(1.3s + var(--i) * 0.07s);
  }

  .thumb {
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #e9e9e6;
    border: 1px solid var(--line);
  }
  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }
  a.tool:hover .thumb img, a.tool:focus-visible .thumb img { transform: scale(1.04); }
  a.tool:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  .meta { display: flex; gap: 0.9rem; align-items: baseline; margin-top: 0.9rem; }
  .num {
    font-size: clamp(0.6rem, 1vw, 0.72rem);
    letter-spacing: 0.2em;
    font-style: italic;
    opacity: 0.45;
    flex: none;
  }
  .txt { min-width: 0; }
  .name {
    position: relative;
    display: inline-block;
    font-size: clamp(1.05rem, 1.55vw, 1.25rem);
    line-height: 1.15;
    letter-spacing: -0.04em;
  }
  .tool .name { position: relative; }
  a.tool:hover .name::after, a.tool:focus-visible .name::after { width: 100%; }
  .desc {
    display: block;
    margin-top: 0.3rem;
    font-size: clamp(0.6rem, 1vw, 0.72rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-style: italic;
    opacity: 0.55;
  }

  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .name { font-size: 1.25rem; } }

  /* ── Animations ── */
  @keyframes wipe   { to { clip-path: inset(0 0% 0 0); } }
  @keyframes expand { to { width: 100%; } }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* ── Tactile / mouvement réduit ── */
  @media (hover: none) {
    html, body, a.tool, .back-link { cursor: auto; }
    #cursor, #ring { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .label, .back-link, a.tool { animation-duration: 0.01s; animation-delay: 0s; }
    .title { animation-duration: 0.01s; animation-delay: 0s; }
    .rule { animation-duration: 0.01s; animation-delay: 0s; }
    .thumb img { transition: none; }
  }
</style>
</head>
<body>

  <img id="cursor" src="assets/curseur-main.png" alt="" width="32" height="30" aria-hidden="true">
  <svg id="ring" aria-hidden="true">
    <rect class="rb"/>
    <rect class="rw"/>
  </svg>

  <a class="back-link" href="index.html" data-umami-event="retour-accueil">← Accueil</a>

  <main class="wrap">
    <p class="label">Loic Bosse-Platière — loicbp.fr</p>
    <div class="title-wrap"><h1 class="title" data-ants>toolbox</h1></div>
    <div class="rule"></div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    // Ajoute tes outils ici : un objet par outil
    // img = capture 960×600 dans assets/previews/
    var TOOLS = [
      { name: "Atelier Raster — trames, pointillé, couches", file: "tools/raster.html", img: "assets/previews/raster.webp", desc: "stochastique, trame AM, dithering, pointillisme, séparation riso" },
      { name: "Outils GIF et Perspective", file: "tools/stickers.html", img: "assets/previews/stickers.webp", desc: "cf titre lol" },
      { name: "Motion Studio", file: "tools/motion-studio.html", img: "assets/previews/motion-studio.webp", desc: "" },
      { name: "Atelier typo", file: "tools/typo.html", img: "assets/previews/typo.webp", desc: "" },
      { name: "PNG/SVG vers STL — extruder une image en STL imprimable", file: "tools/relief1.html", img: "assets/previews/relief1.webp", desc: "3D en gros" },
      { name: "Embossage — matrices mâle / femelle depuis un SVG", file: "tools/embossage.html", img: "assets/previews/embossage.webp", desc: "avec tolérance" },
      { name: "TRAME — image → ASCII/PIXEL", file: "tools/pixascii.html", img: "assets/previews/pixascii.webp", desc: "" },
      { name: "Feuilleté — animation image par image", file: "tools/feuillete.html", img: "assets/previews/feuillete.webp", desc: "" },
      { name: "Perspective — outil de mockup", file: "tools/perspemock.html", img: "assets/previews/perspemock.webp", desc: "" },
      { name: "Découpe en bloc", file: "tools/padc.html", img: "assets/previews/padc.webp", desc: "" },
      { name: "Motion · animation de logos", file: "tools/motion-logo.html", img: "assets/previews/motion-logo.webp", desc: "" },
      { name: "Imposition — PDF en livret", file: "tools/imposition.html", img: "assets/previews/imposition.webp", desc: "livret, cahiers, zine" }
    ];

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    document.getElementById('grid').innerHTML = TOOLS.map(function (t, i) {
      var n = String(i + 1).padStart(2, '0');
      return '<a class="tool" href="' + esc(t.file) + '" style="--i:' + i + '" data-umami-event="ouverture-outil" data-umami-event-outil="' + esc(t.name) + '">' +
        '<div class="thumb">' +
          (t.img ? '<img src="' + esc(t.img) + '" alt="" width="960" height="600" loading="lazy" decoding="async">' : '') +
        '</div>' +
        '<div class="meta"><span class="num">' + n + '</span>' +
          '<div class="txt"><span class="name">' + esc(t.name) + '</span>' +
          (t.desc ? '<span class="desc">' + esc(t.desc) + '</span>' : '') +
        '</div></div></a>';
    }).join('');

    /* ── Curseur main ── */
    const cursorEl = document.getElementById('cursor');
    const ring     = document.getElementById('ring');
    const rects    = ring.querySelectorAll('rect');
    let mx = -100, my = -100;   // souris
    let fx = -100, fy = -100;   // position retardée du rond

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + 'px';
      cursorEl.style.top  = my + 'px';
    });

    /* ── Contour exact des SVG [data-ants="contour"] : on clone chaque tracé en 2 calques (noir + blanc) ── */
    document.querySelectorAll('svg[data-ants="contour"]').forEach(svg => {
      const NS = 'http://www.w3.org/2000/svg';
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'ants');
      svg.querySelectorAll('path, polygon').forEach(sh => {
        if (sh.closest('defs, clipPath')) return;
        ['ab', 'aw'].forEach(cls => {
          const c = document.createElementNS(NS, sh.tagName);
          ['d', 'points'].forEach(a => sh.hasAttribute(a) && c.setAttribute(a, sh.getAttribute(a)));
          c.setAttribute('class', cls);
          g.appendChild(c);
        });
      });
      svg.appendChild(g);
    });

    /* ── Cible survolée : tout [data-ants], lien ou bouton ──
       data-ants="contour" → contour exact (le rond disparaît)
       sinon               → le rond se morphe en rectangle autour de l'élément */
    const PAD = 6;
    let target = null;

    function setTarget(el) {
      if (el === target) return;
      if (target) target.classList.remove('ants-on');
      target = el;
      if (target && target.dataset.ants === 'contour') target.classList.add('ants-on');
    }
    const pick = el => el && el.closest ? el.closest('[data-ants], a, button') : null;

    document.addEventListener('mouseover', e => setTarget(pick(e.target)));
    document.addEventListener('mouseleave', () => setTarget(null));
    document.addEventListener('focusin',  e => { const t = pick(e.target); if (t && t.matches(':focus-visible')) setTarget(t); });
    document.addEventListener('focusout', () => setTarget(null));

    /* ── Rond : cercle au repos → rectangle pointillé sur la cible ── */
    const REST = 26;
    const st = { x: -100, y: -100, w: REST, h: REST, r: REST / 2, o: 0.55 };

    (function frame() {
      fx += (mx - fx) * 0.11;
      fy += (my - fy) * 0.11;

      let g, k;
      if (target && target.dataset.ants === 'contour') {
        g = { x: fx, y: fy, w: 0, h: 0, r: 0, o: 0 };                   // le rond se résorbe, le contour prend le relais
        k = 0.25;
      } else if (target) {
        const b = target.getBoundingClientRect();
        g = { x: b.left - PAD, y: b.top - PAD, w: b.width + PAD * 2, h: b.height + PAD * 2, r: 0, o: 1 };
        k = 0.28;                                                      // snap rapide
      } else {
        g = { x: fx - REST / 2, y: fy - REST / 2, w: REST, h: REST, r: REST / 2, o: 0.55 };
        k = 0.22;
      }
      for (const p in g) st[p] += (g[p] - st[p]) * k;

      const w = Math.max(st.w, 0), h = Math.max(st.h, 0);
      const r = Math.min(Math.max(st.r, 0), w / 2, h / 2);
      rects.forEach(el => {
        el.setAttribute('x', st.x + 0.5);                              // +0.5 : trait de 1px bien net
        el.setAttribute('y', st.y + 0.5);
        el.setAttribute('width',  w);
        el.setAttribute('height', h);
        el.setAttribute('rx', r);
      });
      ring.style.opacity = st.o < 0.01 ? 0 : st.o;
      requestAnimationFrame(frame);
    })();
  </script>
  <script src="assets/trail.js?v=3" defer></script>
</body>
</html>
