<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspective — outil de mockup</title>
<style>
:root{
  --stage:#242528; --panel:#2f3135; --panel2:#383a3f; --line:#45474d; --line2:#55585f;
  --text:#ebe8e2; --muted:#a19e98; --dim:#77756f;
  --frame:#5b6cff;      /* mode cadre : outremer */
  --content:#f0a92e;    /* mode contenu : ambre */
  --danger:#ff6b6b;
  --r:5px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);color:var(--text);font-size:12.5px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--frame);outline-offset:1px}

#app{display:grid;grid-template-columns:52px 1fr 296px;grid-template-rows:46px 1fr 26px;height:100vh}
/* Barre du haut */
#top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid #1d1e20}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.01em;margin-right:10px;font-size:13.5px}
.brand svg{display:block}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r);border:1px solid transparent;background:none}
.tb:hover{background:var(--panel2)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb.icon{padding:0;width:30px;justify-content:center}
.tb.on{background:var(--panel2);border-color:var(--line2)}
.tb.primary{background:var(--frame);color:#fff;font-weight:600}
.tb.primary:hover{filter:brightness(1.1)}
.spacer{flex:1}
#zoomLbl{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.menuWrap{position:relative}
.menu{position:absolute;right:0;top:36px;min-width:230px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:none;z-index:20}
.menu.left{left:0;right:auto}
.menu.open{display:block}
.menu button{display:flex;width:100%;justify-content:space-between;gap:16px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:4px}
.menu button:hover{background:var(--frame);color:#fff}
.menu kbd{color:var(--dim);font-family:inherit}
.menu button:hover kbd{color:#dfe2ff}

/* Outils */
#tools{background:var(--panel);border-right:1px solid #1d1e20;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
.tool{width:38px;height:38px;border-radius:6px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted);position:relative}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.tool.on[data-tool="select"]{color:var(--frame)}
.tool.on[data-tool="content"]{color:var(--content)}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--dim)}
.tsep{width:24px;height:1px;background:var(--line);margin:4px 0}

/* Scène */
#stage{position:relative;overflow:hidden;background:var(--stage)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(30,31,34,.88);border:1px solid var(--line);padding:7px 12px;border-radius:20px;color:var(--muted);white-space:nowrap;pointer-events:none;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis}
#hint b{color:var(--text);font-weight:600}
#drop{position:absolute;inset:10px;border:2px dashed var(--frame);border-radius:10px;background:rgba(91,108,255,.08);display:none;place-items:center;font-size:15px;pointer-events:none}
#drop.on{display:grid}
#empty{position:absolute;inset:0;display:grid;place-items:center}
#empty.hide{display:none}
.emptyCard{width:min(460px,calc(100% - 40px));text-align:left}
.emptyCard .plane{width:100%;aspect-ratio:16/9;margin-bottom:22px}
.emptyCard h1{font-size:22px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.emptyCard p{color:var(--muted);margin:0 0 20px;line-height:1.55;font-size:13.5px}
.emptyCard .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--frame);border-color:var(--frame);color:#fff;font-weight:600}

/* Panneau */
#panel{background:var(--panel);border-left:1px solid #1d1e20;overflow-y:auto;display:flex;flex-direction:column}
.sec{padding:12px 14px 14px;border-bottom:1px solid #26272a}
.sec h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between}
.sec h3 small{color:var(--dim);font-weight:400}
#layerList{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto;margin:0 -6px}
.layer{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--panel2)}
.layer.sel{background:rgba(91,108,255,.18);border-color:rgba(91,108,255,.55)}
.layer .eye{width:22px;height:22px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:4px;padding:0}
.layer .eye:hover{color:var(--text)}
.layer.hidden .nm,.layer.hidden .th{opacity:.4}
.layer .th{width:34px;height:26px;border-radius:3px;background:#1e1f22 center/cover no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--dim)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ty{color:var(--dim);display:grid;place-items:center}
.layer input{width:100%;background:var(--stage);border:1px solid var(--frame);border-radius:3px;padding:2px 4px}
.lacts{display:flex;gap:2px;margin-top:8px}
.lacts button{flex:1;height:28px;border:1px solid var(--line);background:none;border-radius:4px;color:var(--muted);display:grid;place-items:center}
.lacts button:hover{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.lacts button:disabled{opacity:.3;pointer-events:none}
.emptyL{color:var(--dim);padding:6px;line-height:1.5}

.ctl{display:grid;grid-template-columns:82px 1fr 62px;align-items:center;gap:8px;margin:7px 0}
.ctl label{color:var(--muted);cursor:default;user-select:none}
.ctl label[title]{cursor:help}
.num{display:flex;align-items:center;background:var(--stage);border:1px solid var(--line);border-radius:4px;height:24px;padding-right:5px}
.num:focus-within{border-color:var(--frame)}
.num input{width:100%;min-width:0;background:none;border:0;padding:0 2px 0 6px;text-align:right;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{display:none}
.num i{font-style:normal;color:var(--dim);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);margin-top:-4.5px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:0}
.sel2{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:8px;margin:7px 0}
.sel2 label{color:var(--muted)}
select{width:100%;height:26px;background:var(--stage);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;height:28px;border:0;background:none;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--text)}
.seg button:hover{color:var(--text)}
.brow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.brow .btn{height:28px;padding:0 10px;font-size:12px;flex:1}
.imgBox{display:flex;gap:10px;align-items:center}
.imgBox .big{width:72px;height:54px;border-radius:4px;border:1px solid var(--line);background:#1e1f22 center/contain no-repeat;flex:none;display:grid;place-items:center;color:var(--dim)}
.imgBox .meta{color:var(--muted);line-height:1.5;min-width:0}
.imgBox .meta b{color:var(--text);font-weight:600;display:block}
.note{color:var(--dim);line-height:1.5;margin:8px 0 0}
.modeTag{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.modeTag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--frame)}
.modeTag.c::before{background:var(--content)}
.modeTag.m::before{background:#ff3b4e}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;color:var(--muted)}
dl.keys dt{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
dl.keys dd{margin:0}

#status{grid-column:1/4;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid #1d1e20;color:var(--dim);font-variant-numeric:tabular-nums}
#status .sp{flex:1}
#toast{max-width:min(560px,calc(100% - 40px));text-align:center;line-height:1.45;position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
@media (max-width:820px){#app{grid-template-columns:48px 1fr 250px}.brand span,.tb .lbl{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script src="../gate.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6l13-3 5 15-15 3z" stroke="#5b6cff" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9l6-1.4 2 6.4-6.4 1.3z" fill="#f0a92e"/></svg>
      <span>Perspective</span>
    </div>
    <div class="menuWrap">
      <button class="tb" id="btnFile"><span class="lbl">Fichier</span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></button>
      <div class="menu left" id="menuFile">
        <button data-act="openBg">Ouvrir un fond… <kbd>Ctrl O</kbd></button>
        <button data-act="placeImg">Placer une image…</button>
        <button data-act="pasteHelp">Coller depuis Illustrator… <kbd>Ctrl V</kbd></button>
        <button data-act="openProj">Ouvrir un projet (.json)…</button>
        <button data-act="saveProj">Enregistrer le projet <kbd>Ctrl S</kbd></button>
        <button data-act="newDoc">Nouveau document</button>
      </div>
    </div>
    <div class="sep"></div>
    <button class="tb icon" id="btnUndo" title="Annuler (Ctrl Z)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="tb icon" id="btnRedo" title="Rétablir (Ctrl Maj Z)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    <div class="spacer"></div>
    <button class="tb icon" id="btnZoomOut" title="Zoom arrière (Ctrl −)"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/></svg></button>
    <span id="zoomLbl">100 %</span>
    <button class="tb icon" id="btnZoomIn" title="Zoom avant (Ctrl +)"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5v14"/></svg></button>
    <button class="tb" id="btnFit" title="Ajuster à l'écran (Ctrl 0)"><span class="lbl">Ajuster</span></button>
    <button class="tb on" id="btnExtras" title="Afficher / masquer les repères (Ctrl H)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l16-2v16l-16-2z"/><rect x="2.5" y="4.5" width="3" height="3" fill="currentColor"/><rect x="18.5" y="2.5" width="3" height="3" fill="currentColor"/></svg><span class="lbl">Repères</span></button>
    <div class="sep"></div>
    <div class="menuWrap">
      <button class="tb primary" id="btnExport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Exporter</button>
      <div class="menu" id="menuExport">
        <button data-act="expPng">PNG avec le fond <kbd>Ctrl E</kbd></button>
        <button data-act="expPngNoBg">PNG transparent (cadres seuls)</button>
        <button data-act="expJpg">JPEG qualité 92</button>
      </div>
    </div>
  </header>

  <nav id="tools" aria-label="Outils">
    <button class="tool on" data-tool="select" title="Sélection du cadre (V) — déplacer, déformer"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 3l13 8.2-5.8 1.4L10.5 19z" fill="currentColor"/></svg><span class="k">V</span></button>
    <button class="tool" data-tool="content" title="Sélection du contenu (A) — placer l'image dans le cadre"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 3l13 8.2-5.8 1.4L10.5 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span class="k">A</span></button>
    <div class="tsep"></div>
    <button class="tool" data-tool="rect" title="Rectangle déformable (R)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6.5l14-2.5 1 15-14 1.5z"/><g fill="currentColor" stroke="none"><rect x="3.4" y="5" width="3.2" height="3.2"/><rect x="17.4" y="2.4" width="3.2" height="3.2"/><rect x="18.4" y="17.4" width="3.2" height="3.2"/><rect x="4.4" y="18.9" width="3.2" height="3.2"/></g></svg><span class="k">R</span></button>
    <button class="tool" data-tool="pen" title="Plume 4 points (P) — cliquez les 4 coins"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l6 9-3 7H9l-3-7z"/><path d="M12 2.5V10"/><circle cx="12" cy="11.5" r="1.5"/><path d="M8.5 21.5h7"/></svg><span class="k">P</span></button>
    <button class="tool" data-tool="cyl" title="Cylindre (Y) — étiquette, gobelet, canette"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/></svg><span class="k">Y</span></button>
    <button class="tool" data-tool="mask" title="Masque d'occlusion (M) — cacher le cadre là où un objet passe devant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M14.5 3.5l6 6-8.5 8.5-6-6z"/><path d="M6 12l-2.6 2.6a2.8 2.8 0 004 4L10 16"/><path d="M3 21h6"/></svg><span class="k">M</span></button>
    <div class="tsep"></div>
    <button class="tool" data-tool="hand" title="Main (H) — ou maintenez Espace"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 12.5V5.5a1.5 1.5 0 013 0V11m0-6.5a1.5 1.5 0 013 0V11m0-5a1.5 1.5 0 013 0v7.5c0 4-2.6 7-6.6 7-2.6 0-4.1-1.2-5.4-3.2L3.6 13.6a1.5 1.5 0 012.5-1.6L8 14"/></svg><span class="k">H</span></button>
  </nav>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="empty">
      <div class="emptyCard">
        <svg class="plane" viewBox="0 0 320 180" fill="none">
          <rect x=".5" y=".5" width="319" height="179" rx="8" stroke="#45474d"/>
          <path d="M70 52l150-22 40 108-170 14z" stroke="#5b6cff" stroke-width="1.6"/>
          <path d="M104 72l94-13 23 60-106 9z" fill="#f0a92e" opacity=".9"/>
          <g fill="#ebe8e2" stroke="#5b6cff" stroke-width="1.5"><rect x="66" y="48" width="8" height="8"/><rect x="216" y="26" width="8" height="8"/><rect x="256" y="134" width="8" height="8"/><rect x="86" y="148" width="8" height="8"/></g>
        </svg>
        <h1>Commencez par une photo de fond</h1>
        <p>Déposez une image ici, collez-la avec Ctrl V ou ouvrez un fichier. Tracez ensuite vos supports en perspective et glissez vos visuels dedans.</p>
        <div class="row">
          <button class="btn primary" data-act="openBg">Ouvrir une photo</button>
          <button class="btn" data-act="startBlank">Commencer sans fond</button>
          <button class="btn" data-act="openProj">Ouvrir un projet</button>
        </div>
      </div>
    </div>
    <div id="drop">Déposez l'image</div>
    <div id="hint"></div>
  </main>

  <aside id="panel">
    <section class="sec" id="layersSec">
      <h3>Cadres <small id="layerCount"></small></h3>
      <div id="layerList"></div>
      <div class="lacts">
        <button id="lUp" title="Monter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button id="lDown" title="Descendre"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
        <button id="lDup" title="Dupliquer (Ctrl D)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0014.5 4h-9A1.5 1.5 0 004 5.5v9A1.5 1.5 0 005.5 16H8"/></svg></button>
        <button id="lDel" title="Supprimer (Suppr)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </section>
    <div id="props"></div>
  </aside>

  <footer id="status">
    <span id="stDoc">—</span>
    <span id="stPos"></span>
    <span class="sp"></span>
    <span id="stMode"></span>
  </footer>
</div>
<div id="toast"></div>

<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   Perspective — outil de mockup autonome
   Rendu des images déformées en WebGL (maillage), interface en Canvas 2D
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const PI = Math.PI;
const view = $('#view'), vctx = view.getContext('2d');
const stage = $('#stage');
let DPR = window.devicePixelRatio || 1;
const nid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));

const S = {
  doc: { w: 1920, h: 1280 },
  bgId: null,
  layers: [],
  images: {},          // id -> {id, img, src, w, h, thumb, tex, mips}
  sel: null,
  tool: 'select',
  view: { zoom: 1, x: 0, y: 0 },
  extras: true,
  started: false,
  masks: {},          // id -> dataURL (versions de masque)
  brush: { size: 80, hard: .7, reveal: false },
  showMask: false,
};

/* ---------------- WebGL ---------------- */
const glc = document.createElement('canvas');
const glOpts = { alpha: true, premultipliedAlpha: true, antialias: true, preserveDrawingBuffer: true };
let gl = glc.getContext('webgl2', glOpts);
const isGL2 = !!gl;
if (!gl) gl = glc.getContext('webgl', glOpts) || glc.getContext('experimental-webgl', glOpts);
if (!gl) alert("WebGL n'est pas disponible dans ce navigateur : la déformation des images ne peut pas fonctionner.");

const VS = `attribute vec2 aPos;attribute vec2 aUV;attribute float aShade;
uniform vec2 uRes;uniform float uScale;uniform vec2 uOff;uniform vec2 uDoc;
varying vec2 vUV;varying float vShade;varying vec2 vDoc;
void main(){vec2 p=(aPos*uScale+uOff)/uRes;gl_Position=vec4(p.x*2.0-1.0,1.0-p.y*2.0,0.0,1.0);vUV=aUV;vShade=aShade;vDoc=aPos/uDoc;}`;
const FS = `precision highp float;
uniform sampler2D uTex;uniform sampler2D uMask;uniform sampler2D uBg;uniform sampler2D uLo;uniform sampler2D uDisp;uniform sampler2D uBroad;

  n.onchange = () => { set(+n.value); commit(); };
  if (def != null) { const reset = () => { set(def * mul); commit(); }; r.ondblclick = reset; row.querySelector('label').ondblclick = reset; }
  sec.appendChild(row);
  return row;
}
function selectCtl(sec, label, opts, get, set) {
  const row = el('div', 'sel2'); row.innerHTML = `<label>${label}</label>`;
  const s = el('select'); opts.forEach(([v, t]) => { const op = el('option'); op.value = v; op.textContent = t; s.appendChild(op); });
  s.value = get(); s.onchange = () => set(s.value); row.appendChild(s); sec.appendChild(row); return s;
}
function syncPanel() {
  const L = selLayer(); if (!L) return;
  $$('#props [data-key]').forEach(inp => {
    const v = L[inp.dataset.key] * +inp.dataset.mul;
    if (inp.type === 'range') inp.value = v; else if (document.activeElement !== inp) inp.value = fmt(v, +inp.dataset.step);
  });
}
function buildProps() {
  const P = $('#props'); P.innerHTML = '';
  const L = selLayer();
  if (!L) {
    const s = section('Document');
    if (!S.started) { s.appendChild(el('p', 'note', 'Ouvrez une photo de fond pour commencer.')); }
    else {
      const bg = S.images[S.bgId];
      const box = el('div', 'imgBox', `<div class="big"></div><div class="meta"><b>${bg ? 'Photo de fond' : 'Sans fond'}</b>${S.doc.w} × ${S.doc.h} px</div>`);
      if (bg) box.querySelector('.big').style.backgroundImage = `url(${bg.thumb})`;
      s.appendChild(box);
      const br = el('div', 'brow');
      const b1 = el('button', 'btn', bg ? 'Remplacer le fond' : 'Ajouter un fond'); b1.onclick = () => $('#fileBg').click();
      br.appendChild(b1);
      if (bg) { const b2 = el('button', 'btn', 'Retirer le fond'); b2.onclick = () => { S.bgId = null; buildPanel(); req(); commit(); }; br.appendChild(b2); }
      s.appendChild(br);
    }
    const k = section('Raccourcis');
    k.appendChild(el('dl', 'keys', `
      <dt>V / A</dt><dd>Cadre / contenu (Ctrl inverse)</dd>
      <dt>R · P · Y</dt><dd>Rectangle · Plume · Cylindre</dd>
      <dt>Double-clic</dt><dd>Placer ou recadrer l'image</dd>
      <dt>Ctrl V</dt><dd>Coller une image dans le cadre</dd>
      <dt>Flèches</dt><dd>Décaler de 1 px (Maj : 10 px)</dd>
      <dt>Espace</dt><dd>Naviguer · Ctrl molette : zoom</dd>
      <dt>Ctrl H</dt><dd>Masquer les repères</dd>
      <dt>Ctrl D</dt><dd>Dupliquer le cadre</dd>`));
    return;
  }
  const im = S.images[L.imgId];
  // Image
  const sI = section('Image');
  const box = el('div', 'imgBox', `<div class="big">${im ? '' : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'}</div><div class="meta"><b>${im ? 'Image placée' : 'Cadre vide'}</b>${im ? im.w + ' × ' + im.h + ' px' : 'Collez (Ctrl V), glissez un fichier ou choisissez-en un.'}</div>`);
  if (im) box.querySelector('.big').style.backgroundImage = `url(${im.thumb})`;
  sI.appendChild(box);
  const br = el('div', 'brow');
  const bc = el('button', 'btn' + (im ? '' : ' primary'), im ? 'Remplacer…' : 'Choisir une image…'); bc.onclick = () => pickImageFor(L.id); br.appendChild(bc);
  if (im) { const bx = el('button', 'btn', 'Retirer'); bx.onclick = () => { L.imgId = null; buildPanel(); req(); commit(); }; br.appendChild(bx); }
  sI.appendChild(br);

  if (im) {
    const sP = section('Placement', S.tool === 'content' ? 'mode contenu actif' : 'A pour glisser l\'image');
    const seg = el('div', 'seg');
    [['cover', 'Remplir le cadre'], ['contain', 'Ajuster au cadre']].forEach(([v, t]) => {
      const b = el('button', L.fit === v ? 'on' : '', t);
      b.onclick = () => { L.fit = v; L.scale = 1; L.ox = 0; L.oy = 0; buildProps(); req(); commit(); };
      seg.appendChild(b);
    });
    sP.appendChild(seg);
    rangeCtl(sP, { key: 'scale', label: 'Échelle', min: 10, max: 400, step: 1, mul: 100, unit: '%', def: 1, min0: 2, tip: 'Double-clic pour réinitialiser' });
    rangeCtl(sP, { key: 'ox', label: 'Position X', min: -100, max: 100, step: .5, mul: 100, unit: '%', def: 0 });
    rangeCtl(sP, { key: 'oy', label: 'Position Y', min: -100, max: 100, step: .5, mul: 100, unit: '%', def: 0 });
    rangeCtl(sP, { key: 'rot', label: 'Rotation', min: -180, max: 180, step: .5, mul: 1, unit: '°', def: 0 });
    const b2 = el('div', 'brow');
    const bf = el('button', 'btn', L.flipX ? 'Miroir activé' : 'Miroir horizontal'); bf.onclick = () => { L.flipX = !L.flipX; buildProps(); req(); commit(); };
    const bq = el('button', 'btn', 'Rot. 90°'); bq.onclick = () => { L.rot = ((L.rot + 90 + 540) % 360) - 180; syncPanel(); req(); commit(); };
    const brs = el('button', 'btn', 'Recentrer'); brs.onclick = () => { L.scale = 1; L.ox = 0; L.oy = 0; L.rot = 0; syncPanel(); req(); commit(); };
    b2.append(bf, bq, brs); sP.appendChild(b2);
  }

  if (im) {
    // Réalisme
    const sX = section('Réalisme', 'd\'après la photo');
    if (!S.bgId) sX.appendChild(el('p', 'note', 'Ajoutez une photo de fond pour reprendre sa lumière et son relief.'));
    else {
      rangeCtl(sX, { key: 'photoLight', label: 'Lumière', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: 0, tip: 'Reporte les ombres et reflets de la photo sur le visuel' });
      rangeCtl(sX, { key: 'photoLightSize', label: 'Étendue', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: .5, tip: 'Faible : texture fine (papier, grain). Forte : grandes ombres et dégradés' });
      rangeCtl(sX, { key: 'disp', label: 'Relief', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: 0, tip: 'Le visuel ondule en suivant les plis de la photo (tissu, papier froissé)' });
      rangeCtl(sX, { key: 'dispSmooth', label: 'Lissage', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: .4, tip: 'Faible : suit chaque détail. Fort : ne garde que les grands plis' });
      sX.appendChild(el('p', 'note', 'Commencez vers 60 % de lumière ; le relief se dose plutôt entre 10 et 30 %.'));
    }
    // Masque
    const sM = section('Masque', L.maskId ? 'actif' : '');
    const mb = el('div', 'brow');
    const bp = el('button', 'btn' + (S.tool === 'mask' ? ' primary' : ''), S.tool === 'mask' ? 'Pinceau actif' : 'Peindre le masque'); bp.onclick = () => setTool(S.tool === 'mask' ? 'select' : 'mask');
    mb.appendChild(bp);
    if (L.maskId) {
      const bi = el('button', 'btn', 'Inverser'); bi.onclick = () => invertMask(L);
      const be = el('button', 'btn', 'Supprimer'); be.onclick = () => { L.maskId = null; req(); buildProps(); commit(); };
      mb.append(bi, be);
    }
    sM.appendChild(mb);
    if (S.tool === 'mask') {
      const sg = el('div', 'seg'); sg.style.marginTop = '10px';
      [[false, 'Masquer'], [true, 'Révéler']].forEach(([v, t]) => { const b = el('button', S.brush.reveal === v ? 'on' : '', t); b.onclick = () => { S.brush.reveal = v; buildProps(); req(); }; sg.appendChild(b); });
      sM.appendChild(sg);
      brushCtl(sM, { key: 'size', label: 'Taille', min: 2, max: 600, step: 1, mul: 1, unit: 'px' });
      brushCtl(sM, { key: 'hard', label: 'Dureté', min: 0, max: 100, step: 1, mul: 100, unit: '%' });
    }
    if (L.maskId && S.tool !== 'mask') {
      const lb = el('label', 'note'); lb.style.display = 'flex'; lb.style.gap = '6px'; lb.style.alignItems = 'center';
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = S.showMask; cb.onchange = () => { S.showMask = cb.checked; req(); };
      lb.append(cb, document.createTextNode('Afficher la zone masquée en rouge')); sM.appendChild(lb);
    }
    if (!L.maskId && S.tool !== 'mask') sM.appendChild(el('p', 'note', 'Peignez sur les objets qui passent devant le support (main, anse, reflet) pour les remettre au premier plan.'));
  }
  // Support
  const sS = section('Support');
  const segT = el('div', 'seg');
  [['quad', 'Plan'], ['cyl', 'Cylindre']].forEach(([v, t]) => { const b = el('button', L.type === v ? 'on' : '', t); b.onclick = () => setType(L, v); segT.appendChild(b); });
  sS.appendChild(segT);
  selectCtl(sS, 'Proportions', ASPECTS, () => L.aspect, v => { L.aspect = v; req(); commit(); }).title = 'Proportions réelles du support à plat (affiche, écran, étiquette…)';
  if (L.type === 'cyl') {
    rangeCtl(sS, { key: 'arc', label: 'Enroulement', min: 10, max: 180, step: 1, unit: '°', def: 150, tip: 'Portion visible du cylindre : 180° = une demi-canette' });
    rangeCtl(sS, { key: 'shade', label: 'Ombrage', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: .35 });
    rangeCtl(sS, { key: 'light', label: 'Lumière', min: -100, max: 100, step: 1, mul: 100, unit: '%', def: 0, tip: 'Décale la zone éclairée vers la gauche ou la droite' });
    sS.appendChild(el('p', 'note', 'Les points ronds règlent la courbure des bords haut et bas.'));
  }
  // Rendu
  const sR = section('Rendu');
  rangeCtl(sR, { key: 'opacity', label: 'Opacité', min: 0, max: 100, step: 1, mul: 100, unit: '%', def: 1 });
  selectCtl(sR, 'Fusion', BLENDS, () => L.blend, v => { L.blend = v; req(); commit(); });
  sR.appendChild(el('p', 'note', 'Astuce : le mode Produit laisse passer les plis et la texture de la photo.'));
  syncPanel();
}
function brushCtl(sec, { key, label, min, max, step = 1, mul = 1, unit = '' }) {
  const row = el('div', 'ctl');
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><span class="num"><input type="number" step="${step}"><i>${unit}</i></span>`;
  const [r, n] = row.querySelectorAll('input');
  r.dataset.bkey = n.dataset.bkey = key; r.dataset.mul = n.dataset.mul = mul;
  const set = v => { if (!isFinite(v)) return; v = clamp(v, key === 'hard' ? 0 : 1, key === 'hard' ? 100 : 3000); S.brush[key] = v / mul; r.value = v; n.value = fmt(v, 1); req(); };
  r.oninput = () => set(+r.value); n.onchange = () => set(+n.value);
  r.value = S.brush[key] * mul; n.value = fmt(S.brush[key] * mul, 1);
  sec.appendChild(row);
}
function syncBrush() { $$('#props [data-bkey]').forEach(i => { const v = S.brush[i.dataset.bkey] * +i.dataset.mul; if (i.type === 'range') i.value = v; else i.value = fmt(v, 1); }); }
let pickTarget = null;
function pickImageFor(id) { pickTarget = id; $('#fileImg').value = ''; $('#fileImg').click(); }

/* ---------------- Fichiers ---------------- */
$('#fileBg').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const im = await imageFromFile(f); if (im) setBackground(im); };
$('#fileImg').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const im = await imageFromFile(f); if (!im) return;
  if (!S.started) return setBackground(im);
  const L = getL(pickTarget); pickTarget = null;
  if (L) assignImage(L, im); else newLayerForImage(im);
};
$('#fileProj').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadProject(f); };
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function saveProject() {
  if (!S.started) return toast('Rien à enregistrer pour l\'instant.');
  const used = new Set([S.bgId, ...S.layers.map(l => l.imgId)].filter(Boolean));
  const images = {}; used.forEach(id => images[id] = S.images[id].src);
  const masks = {}; S.layers.forEach(l => { if (l.maskId && S.masks[l.maskId]) masks[l.maskId] = S.masks[l.maskId]; });
  const data = { app: 'perspective-mockup', v: 2, doc: S.doc, bgId: S.bgId, layers: S.layers, images, masks };
  download(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'projet-perspective.json');
  toast('Projet enregistré, images incluses.');
}
async function loadProject(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'perspective-mockup') throw new Error();
    for (const [id, src] of Object.entries(data.images || {})) await addImage(src, id);
    Object.assign(S.masks, data.masks || {});
    S.doc = data.doc; S.bgId = data.bgId; S.layers = data.layers.map(normLayer); S.sel = null; S.started = true;
    layerN = S.layers.length;
    hist = []; hIdx = -1; commit();
    updEmpty(); fitView(); buildPanel(); toast('Projet ouvert.');
  } catch (e) { toast('Ce fichier n\'est pas un projet Perspective valide.'); }
}
function exportImg(fmtName, withBg) {
  if (!S.started) return toast('Ouvrez d\'abord une image.');
  closeMenus();
  const m = Math.max(S.doc.w, S.doc.h), s = Math.min(1, MAXRB / m);
  const W = Math.round(S.doc.w * s), H = Math.round(S.doc.h * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  if (fmtName === 'jpg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  renderScene(ctx, { s, tx: 0, ty: 0, W, H, bg: withBg, full: true });
  const type = fmtName === 'jpg' ? 'image/jpeg' : 'image/png';
  c.toBlob(b => { download(b, 'mockup' + (withBg ? '' : '-transparent') + '.' + fmtName); toast(`Exporté en ${W} × ${H} px.`); }, type, .92);
  req();
}
function newDoc() {
  if (S.layers.length && !confirm('Fermer le document actuel ? Pensez à enregistrer le projet si besoin.')) return;
  S.layers = []; S.bgId = null; S.sel = null; S.started = false; S.doc = { w: 1920, h: 1280 }; layerN = 0; S.masks = {};
  hist = []; hIdx = -1; commit(); updEmpty(); buildPanel(); req();
}
function startBlank() { S.started = true; S.doc = { w: 1920, h: 1280 }; updEmpty(); fitView(); buildPanel(); commit(); setTool('rect'); }

/* ---------------- Barre du haut ---------------- */
function closeMenus() { $$('.menu').forEach(m => m.classList.remove('open')); }
function toggleExtras() { S.extras = !S.extras; $('#btnExtras').classList.toggle('on', S.extras); req(); }
let toastT;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
function updEmpty() { $('#empty').classList.toggle('hide', S.started); updHint(); updStatus(); }
const ACTS = {
  openBg: () => $('#fileBg').click(),
  placeImg: () => { if (!S.started) return $('#fileBg').click(); pickImageFor(S.sel); },
  openProj: () => $('#fileProj').click(),
  saveProj: saveProject, newDoc, startBlank,
  pasteHelp: () => toast('Copiez votre objet dans Illustrator (Ctrl C) puis faites Ctrl V ici. Il arrive en vectoriel, net à toutes les tailles. Il faut que la copie SVG soit activée dans Préférences › Gestion du presse-papiers.', 7000),
  expPng: () => exportImg('png', true), expPngNoBg: () => exportImg('png', false), expJpg: () => exportImg('jpg', true),
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { closeMenus(); ACTS[b.dataset.act](); return; }
  if (!e.target.closest('.menuWrap')) closeMenus();
});
$('#btnFile').onclick = () => { const m = $('#menuFile'), o = m.classList.contains('open'); closeMenus(); if (!o) m.classList.add('open'); };
$('#btnExport').onclick = () => { const m = $('#menuExport'), o = m.classList.contains('open'); closeMenus(); if (!o) m.classList.add('open'); };
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#btnZoomIn').onclick = () => setZoom(S.view.zoom * 1.25);
$('#btnZoomOut').onclick = () => setZoom(S.view.zoom / 1.25);
$('#btnFit').onclick = fitView;
$('#btnExtras').onclick = toggleExtras;
$$('.tool').forEach(b => b.onclick = () => { if (S.started) setTool(b.dataset.tool); });
$('#lUp').onclick = () => reorder(1); $('#lDown').onclick = () => reorder(-1);
$('#lDup').onclick = duplicateSel; $('#lDel').onclick = deleteSel;

new ResizeObserver(() => req()).observe(stage);
commit(); buildPanel(); updEmpty(); updZoom(); req();
</script>
