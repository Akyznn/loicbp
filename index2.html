<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>lbp — index2</title>
  <meta name="description" content="Loïc BP — portfolio de design graphique : identités visuelles, éditions, direction artistique." />
  <script src="gate.js"></script>
  <style>
    @font-face {
      font-family: 'BIZ UDKerned';
      src: url('assets/fonts/BIZUDkerned-Regular.woff') format('woff');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg: #fdfdfd;
    --check-a: #fdfdfd;
    --check-b: #efefef;
    --check: 11px;      /* taille d'une case du damier */
    --trame: 720px;     /* largeur d'UNE occurrence de la trame (assets/trame.svg) */
    --trame-x: -30px;   /* décalage : la trame dépasse en haut à gauche */
    --trame-y: -20px;
      --ink: #0f0f0f;
    }

    html, body {
      height: 100%;
      cursor: none;
    }

    body {
      background-color: var(--check-a);
    background-image:
      url('assets/trame.svg?v=3'),
      conic-gradient(var(--check-b) 25%, var(--check-a) 0 50%, var(--check-b) 0 75%, var(--check-a) 0);
    /* une seule trame par bloc de 2×2 : vide autour (haut/bas/gauche/droite ET diagonales) de la taille du SVG */
    background-size:
      calc(var(--trame) * 2) auto,
      calc(var(--check) * 2) calc(var(--check) * 2);
    background-position:
      calc(var(--trame-x) - var(--bgx, 0px)) var(--trame-y),
      0 0;
    background-repeat: repeat, repeat;
      color: var(--ink);
      font-family: 'BIZ UDKerned', 'BIZ UDPGothic', system-ui, sans-serif;
      min-height: 100vh;
      user-select: none;
    }

    /* ── Curseur main (PNG) ── */
    #cursor {
      position: fixed;
      top: 0; left: 0;
      width: 32px;
      height: auto;
      pointer-events: none;
      z-index: 9999;
      /* hotspot = bout de l'index (≈ 5px, 1px) */
      transform: translate(-5px, -1px);
      will-change: left, top;
    }

    /* ── Sélection "Photoshop" : tracé pointillé noir/blanc animé (fourmis) ──
       --ant = longueur d'un tiret (px) ; --ant-speed = durée d'un cycle            */
    :root { --ant: 4px; --ant-speed: 0.4s; }

    /* Le rond qui suit la souris : même effet, se morphe sur l'élément survolé */
    #ring {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      overflow: visible;
    }
    #ring rect { fill: none; stroke-width: 1; stroke-dasharray: var(--ant) var(--ant); }
    #ring .rb { stroke: #0f0f0f; animation: march var(--ant-speed) linear infinite; }
    #ring .rw { stroke: #fff; stroke-dashoffset: var(--ant); animation: march-w var(--ant-speed) linear infinite; }

    /* Contour exact d'un SVG (logo) : calque de tracés clonés, visible au survol */
    .ants { opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
    .ants-on .ants { opacity: 1; }
    .ants * {
      fill: none;
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;   /* 1px et tirets constants quelle que soit la taille du logo */
      stroke-dasharray: var(--ant) var(--ant);
    }
    .ants .ab { stroke: #0f0f0f; animation: march var(--ant-speed) linear infinite; }
    .ants .aw { stroke: #fff; stroke-dashoffset: var(--ant); animation: march-w var(--ant-speed) linear infinite; }

    @keyframes march   { to { stroke-dashoffset: calc(var(--ant) * -2); } }
    @keyframes march-w { to { stroke-dashoffset: calc(var(--ant) * -1); } }

    @media (prefers-reduced-motion: reduce) {
      #ring .rb, #ring .rw, .ants .ab, .ants .aw { animation: none; }
    }

    /* ── Écrans tactiles : pas de curseur custom ── */
    @media (hover: none) {
      html, body { cursor: auto; }
      #cursor, #ring { display: none; }
    }

    /* ── En-tête : logo centré en haut ── */
    :root { --logo-w: clamp(140px, 15vw, 280px); }

    ::selection { background: #2A3DFF; color: #fff; }
    ::-moz-selection { background: #2A3DFF; color: #fff; }
    .cap-l, .cap-y, .pn-body, .pn-meta { -webkit-user-select: text; user-select: text; cursor: text; }
    .site-header {
      display: flex;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3.2rem) 1.2rem 0;
    }
    .site-header .logo {
      display: block;
      width: var(--logo-w);
      height: auto;
      overflow: visible;
    }

    /* ── Apparition du logo : le symbole se dévoile (même "wipe" que les titres), puis les lettres montent une à une ── */
    .logo .wipe {
      transform-box: fill-box;
      transform-origin: 0 50%;
      transform: scaleX(0);
      animation: logo-wipe 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.1s;
    }
    .logo .lt {
      opacity: 0;
      transform: translateY(10px);
      animation: logo-rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(0.55s + var(--i) * 0.045s);
    }
    @keyframes logo-wipe { to { transform: scaleX(1); } }
    @keyframes logo-rise { to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .logo .wipe, .logo .lt { animation-duration: 0.01s; animation-delay: 0s; }
    }

    /* ═════════════ Galerie horizontale ═════════════ */
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --gutter: clamp(1.2rem, 4vw, 3rem);
      --gap: clamp(1rem, 2.2vw, 2rem);
      --vpad: clamp(0.6rem, 2vh, 1.4rem);
      --cap-h: 66px;               /* hauteur réservée à la légende sous l'image */
      --card-max: 720px;           /* hauteur max d'une image sur très grand écran */
      --line: rgba(15, 15, 15, 0.14);
    }

    /* La page ne défile pas : le logo en haut, la bande de projets au milieu, la barre en bas */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; min-height: 0; height: 100dvh; }

    ::selection { background: #2A3DFF; color: #fff; }
    ::-moz-selection { background: #2A3DFF; color: #fff; }
    .cap-l, .cap-y, .pn-body, .pn-meta { -webkit-user-select: text; user-select: text; cursor: text; }
    .site-header { flex: none; padding: clamp(1rem, 2.6vh, 2.2rem) 1.2rem 0; }
    :root { --logo-w: clamp(120px, min(15vw, 17vh), 240px); }

    .rail {
      flex: 1;
      min-height: 0;
      container-type: size;                 /* permet d'utiliser 100cqh = hauteur de la bande */
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
    }
    .rail::-webkit-scrollbar { display: none; }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--gap);
      width: max-content;
      height: 100%;
      padding: 0 var(--gutter);
    }

    .card {
      flex: none;
      --enter: 70px;
      --img-h: min(calc(100cqh - var(--cap-h) - var(--vpad) * 2), 74cqh, var(--card-max));
      width: calc(var(--img-h) * var(--ar));
      transition: opacity 0.2s ease;
    }

    /* ── Image ── */
    .media {
      position: relative;
      display: block;
      width: 100%;
      height: var(--img-h);
      padding: 0;
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      cursor: none;
      font: inherit;
      color: inherit;
      clip-path: inset(0 100% 0 0);           /* état initial : se dévoile à l'entrée */
    }
    .media:focus-visible { outline: none; }
    .media.noimg::after { content: attr(aria-label); position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
    .par { position: absolute; inset: 0 -18px; will-change: transform; }   /* calque de parallaxe */
    .media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.18);
      user-select: none;
      -webkit-user-drag: none;
    }
    .media img.contain { object-fit: contain; padding: 10%; }
    .media img.ok { opacity: 1; }

    /* Révélation : le cadre se dévoile (même "wipe" que les titres), l'image se pose */
    .card.in .media {
      clip-path: inset(0 0 0 0);
      transition: clip-path 0.5s var(--ease-out) var(--rd, 0s);
    }
    .card.in .media img {
      transform: scale(var(--s, 1));
      transition: transform 0.6s var(--ease-out) var(--rd, 0s), opacity 0.25s ease var(--rd, 0s);
    }
    .card.done .media { transition: none; }
    .card.done .media img { transition: transform 0.45s var(--ease-out), opacity 0.3s ease; }

    /* ── Légende ── */
    .cap {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      height: var(--cap-h);
      padding-top: 0.75rem;
      opacity: 0;
      transform: translateY(8px);
    }
    .card.in .cap {
      opacity: 1;
      transform: none;
      transition: opacity 0.3s ease calc(var(--rd, 0s) + 0.2s), transform 0.45s var(--ease-out) calc(var(--rd, 0s) + 0.2s);
    }
    .cap-l { min-width: 0; }
    .cap-t {
      display: inline;
      font-size: clamp(1.05rem, 1.5vw, 1.3rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.005em;
      background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
      transition: background-size 0.2s ease-out;
    }
    .cap-m, .cap-y {
      font-size: clamp(0.66rem, 1.05vw, 0.78rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-style: normal;
    }
    .cap-m { margin-top: 0.35rem; opacity: 0.55; }
    .cap-y { flex: none; opacity: 0.55; padding-top: 0.25em; }

    @media (hover: hover) {
      .card:hover .media img { --s: 1.045; }
      .card:hover .cap-t { background-size: 100% 1px; }
      .track:has(.card:hover) .card:not(:hover) { opacity: 0.42; }
    }

    /* ── Barre du bas : compteur, progression, indication ── */
    .hud {
      flex: none;
      display: flex;
      align-items: center;
      gap: 1.4rem;
      padding: 0.9rem var(--gutter) clamp(0.9rem, 2.4vh, 1.5rem);
      font-size: clamp(0.66rem, 1.05vw, 0.78rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-style: normal;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.9s;
    }
    .count { display: inline-block; min-width: 6.5ch; overflow: hidden; font-variant-numeric: tabular-nums; }
    .count b { display: inline-block; font-weight: 400; }
    .count b.tick { animation: tick 0.45s var(--ease-out); }
    .bar { position: relative; flex: 1; height: 1px; background: var(--line); }
    .bar i { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
    .hint { display: inline-flex; gap: 0.6em; align-items: center; transition: opacity 0.5s ease; }
    .hint span { display: inline-block; animation: nudge 1.6s ease-in-out infinite; }
    body.moved .hint { opacity: 0; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .views { display: inline-flex; gap: 1.2rem; flex: none; }
    .views button {
      background: none; border: 0; padding: 0.4em 0; font: inherit; letter-spacing: inherit; text-transform: inherit;
      color: inherit; cursor: none; opacity: 0.5; border-bottom: 1px solid transparent; transition: opacity 0.25s ease, border-color 0.25s ease;
    }
    .views button:hover, .views button:focus-visible { opacity: 0.85; outline: none; }
    .views button[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--ink); }

    /* ── Vue Galerie : colonnes, proportions naturelles de chaque image ── */
    .grid { display: none; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 1.2rem var(--gutter) 1.5rem; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    body.view-grid .grid { display: block; }
    body.view-grid .rail { display: none; }
    body.view-grid .hint { display: none; }
    .gcols { column-count: 3; column-gap: var(--gap); }
    .card.gi { display: block; width: auto; break-inside: avoid; margin-bottom: clamp(1.4rem, 3vw, 2.4rem); }
    .gi .media { height: auto; aspect-ratio: var(--ar); }
    .gi .cap { height: auto; min-height: var(--cap-h); }
    @media (max-width: 1100px) { .gcols { column-count: 2; } }
    @media (max-width: 560px)  { .gcols { column-count: 1; } }
    @media (hover: none) { .views button { cursor: auto; } }
    /* Retour d'appui : l'interface « sent » le clic */
    .views button, .pn-nav button, .pn-close { transition: transform 0.16s var(--ease-out), opacity 0.25s ease, border-color 0.25s ease; }
    .views button:active, .pn-nav button:active, .pn-close:active { transform: scale(0.96); }
    .media:active img { --s: 1.02; }
    @keyframes tick  { from { transform: translateY(70%); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

    /* ═════════════ Fiche projet (panneau) ═════════════ */
    .panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      background-color: var(--check-a);
      background-image: conic-gradient(var(--check-b) 25%, var(--check-a) 0 50%, var(--check-b) 0 75%, var(--check-a) 0);
      background-size: calc(var(--check) * 2) calc(var(--check) * 2);
      clip-path: inset(0 0 0 0);
    }
    .panel[hidden] { display: none; }

    .pn-media { padding: clamp(4rem, 9vh, 6rem) 0 var(--gutter) var(--gutter); min-height: 0; }
    .pn-frame {
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line);
      overflow: hidden;
      clip-path: inset(100% 0 0 0);
    }
    .panel.open .pn-frame { clip-path: inset(0 0 0 0); transition: clip-path 0.45s var(--ease-out) 0.1s; }
    .pn-frame img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
    .pn-frame img.contain { padding: 8%; }

    .pn-body {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(4rem, 9vh, 6rem) var(--gutter) var(--gutter) clamp(1.4rem, 3.5vw, 3.5rem);
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .rv { opacity: 0; transform: translateY(10px); }
    .panel.open .rv {
      opacity: 1;
      transform: none;
      transition: opacity 0.3s ease calc(0.22s + var(--i, 0) * 0.045s), transform 0.4s var(--ease-out) calc(0.22s + var(--i, 0) * 0.045s);
    }
    .pn-meta, .pn-liv, .pn-nav, .pn-close {
      font-size: clamp(0.66rem, 1.05vw, 0.78rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-style: normal;
    }
    .pn-meta { color: rgba(15, 15, 15, 0.6); }
    .pn-title-wrap { overflow: hidden; margin: 1.1rem 0 1.4rem; }
    .pn-title {
      display: block;
      font-size: clamp(2.2rem, 5.2vw, 4.6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      clip-path: inset(0 100% 0 0);
    }
    .panel.open .pn-title { clip-path: inset(0 0 0 0); transition: clip-path 0.45s var(--ease-out) 0.22s; }
    .pn-lead { font-size: clamp(1.25rem, 1.9vw, 1.7rem); line-height: 1.25; font-style: normal; margin-bottom: 1.6rem; max-width: 34ch; }
    .pn-text p { font-size: clamp(1.1rem, 1.4vw, 1.32rem); line-height: 1.45; max-width: 46ch; margin-bottom: 1em; }
    .pn-liv { margin: 1.8rem 0 0; padding-top: 1.1rem; border-top: 1px solid var(--line); line-height: 1.9; color: rgba(15, 15, 15, 0.72); }
    .pn-nav { display: flex; align-items: center; gap: 1.4rem; margin-top: 2.2rem; }
    .pn-nav button, .pn-close {
      position: relative;
      background: none;
      border: 0;
      padding: 0.5em 0;
      color: var(--ink);
      font-family: inherit;
      cursor: none;
    }
    .pn-nav button::after, .pn-close::after {
      content: '';
      position: absolute;
      bottom: 0.1em; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s ease;
    }
    .pn-nav button:hover::after, .pn-close:hover::after,
    .pn-nav button:focus-visible::after, .pn-close:focus-visible::after { width: 100%; }
    .pn-nav button:focus-visible, .pn-close:focus-visible { outline: none; }
    .pn-n { opacity: 0.5; font-variant-numeric: tabular-nums; }
    .pn-close { position: absolute; top: clamp(1rem, 2.5vw, 1.8rem); right: clamp(1rem, 2.5vw, 1.8rem); z-index: 2; }

    .panel.closing .pn-media, .panel.closing .pn-body, .panel.closing .pn-close { opacity: 0; transition: opacity 0.15s ease; }

    @media (max-width: 760px) {
      .panel { grid-template-columns: 1fr; grid-template-rows: 40dvh minmax(0, 1fr); }
      .pn-media { padding: 3.6rem var(--gutter) 0; }
      .pn-body { padding: 1.4rem var(--gutter) var(--gutter); }
    }

    @media (hover: none) {
      .media, .pn-nav button, .pn-close { cursor: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .media { clip-path: none !important; }
      .media img { transform: none !important; transition: opacity 0.3s ease !important; }
      .cap { opacity: 1 !important; transform: none !important; transition: none !important; }
      .hint span, .count b.tick { animation: none; }
      .pn-frame, .pn-title { clip-path: none !important; }
      .rv { opacity: 1 !important; transform: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <img id="cursor" src="assets/curseur-main.png" alt="" width="32" height="30" aria-hidden="true" />
  <svg id="ring" aria-hidden="true">
    <rect class="rb"/>
    <rect class="rw"/>
  </svg>

  <script>
    /* ── Curseur main ── */
    const cursorEl = document.getElementById('cursor');
    const ring     = document.getElementById('ring');
    const rects    = ring.querySelectorAll('rect');
    let mx = -100, my = -100;   // souris
    let fx = -100, fy = -100;   // position retardée du rond

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + 'px';
      cursorEl.style.top  = my + 'px';
    });

    /* ── Contour exact des SVG [data-ants="contour"] : on clone chaque tracé en 2 calques (noir + blanc) ── */
    document.querySelectorAll('svg[data-ants="contour"]').forEach(svg => {
      const NS = 'http://www.w3.org/2000/svg';
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'ants');
      svg.querySelectorAll('path, polygon').forEach(sh => {
        if (sh.closest('defs, clipPath')) return;
        ['ab', 'aw'].forEach(cls => {
          const c = document.createElementNS(NS, sh.tagName);
          ['d', 'points'].forEach(a => sh.hasAttribute(a) && c.setAttribute(a, sh.getAttribute(a)));
          c.setAttribute('class', cls);
          g.appendChild(c);
        });
      });
      svg.appendChild(g);
    });

    /* ── Cible survolée : tout [data-ants], lien ou bouton ──
       data-ants="contour" → contour exact (le rond disparaît)
       sinon               → le rond se morphe en rectangle autour de l'élément */
    const PAD = 6;
    let target = null;

    function setTarget(el) {
      if (el === target) return;
      if (target) target.classList.remove('ants-on');
      target = el;
      if (target && target.dataset.ants === 'contour') target.classList.add('ants-on');
    }
    const pick = el => el && el.closest ? el.closest('[data-ants], a, button') : null;

    document.addEventListener('mouseover', e => setTarget(pick(e.target)));
    document.addEventListener('mouseleave', () => setTarget(null));
    document.addEventListener('focusin',  e => { const t = pick(e.target); if (t && t.matches(':focus-visible')) setTarget(t); });
    document.addEventListener('focusout', () => setTarget(null));

    /* ── Rond : cercle au repos → rectangle pointillé sur la cible ── */
    const REST = 26;
    const st = { x: -100, y: -100, w: REST, h: REST, r: REST / 2, o: 0.55 };

    (function frame() {
      fx += (mx - fx) * 0.11;
      fy += (my - fy) * 0.11;

      let g, k;
      if (target && target.dataset.ants === 'contour') {
        g = { x: fx, y: fy, w: 0, h: 0, r: 0, o: 0 };                   // le rond se résorbe, le contour prend le relais
        k = 0.25;
      } else if (target) {
        const b = target.getBoundingClientRect();
        g = { x: b.left - PAD, y: b.top - PAD, w: b.width + PAD * 2, h: b.height + PAD * 2, r: 0, o: 1 };
        k = 0.28;                                                      // snap rapide
      } else {
        g = { x: fx - REST / 2, y: fy - REST / 2, w: REST, h: REST, r: REST / 2, o: 0.55 };
        k = 0.22;
      }
      for (const p in g) st[p] += (g[p] - st[p]) * k;

      const w = Math.max(st.w, 0), h = Math.max(st.h, 0);
      const r = Math.min(Math.max(st.r, 0), w / 2, h / 2);
      rects.forEach(el => {
        el.setAttribute('x', st.x + 0.5);                              // +0.5 : trait de 1px bien net
        el.setAttribute('y', st.y + 0.5);
        el.setAttribute('width',  w);
        el.setAttribute('height', h);
        el.setAttribute('rx', r);
      });
      ring.style.opacity = st.o < 0.01 ? 0 : st.o;
      requestAnimationFrame(frame);
    })();
  </script>
  <script>
  /* ═════════════ Galerie horizontale ═════════════ */
  (async function () {
    const rail  = document.getElementById('rail');
    const track = document.getElementById('track');
    const bar   = document.getElementById('bar');
    const countEl = document.getElementById('count');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
    const pad2 = n => String(n).padStart(2, '0');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /* ── Données ── */
    let data = [];
    try { data = await (await fetch('assets/projets.json')).json(); }
    catch (e) { console.error('projets.json introuvable', e); return; }
    const N = data.length;
    countEl.textContent = '01 / ' + pad2(N);

    /* ── Cartes ── */
    const tpl = (p, i, cls, arMax) => {
      const contain = p.cover.fit === 'contain';
      const ar = contain ? (cls ? 1.3 : 1.7) : clamp(p.cover.w / p.cover.h, 0.62, arMax);
      return '<article class="card' + cls + '" data-i="' + i + '" style="--ar:' + ar.toFixed(3) + '">' +
        '<button class="media" type="button" data-ants aria-label="Ouvrir le projet ' + esc(p.titre) + '">' +
          '<div class="par"><img src="' + esc(p.cover.src) + '" alt="' + esc(p.titre) + '" width="' + p.cover.w + '" height="' + p.cover.h + '"' +
          (i < 4 ? '' : ' loading="lazy"') + ' decoding="async" draggable="false"' + (contain ? ' class="contain"' : '') + '></div>' +
        '</button>' +
        '<div class="cap"><div class="cap-l"><h2 class="cap-t">' + esc(p.titre) + '</h2>' +
          '<p class="cap-m">' + esc(p.disciplines.join(' / ')) + '</p></div>' +
          '<span class="cap-y">' + (p.annee || '') + '</span></div>' +
      '</article>';
    };
    track.innerHTML = data.map((p, i) => tpl(p, i, '', 1.6)).join('');
    const gcols = document.getElementById('gcols'), gridEl = document.getElementById('grid');
    gcols.innerHTML = data.map((p, i) => tpl(p, i, ' gi', 1.85)).join('');
    const gcards = [...gcols.children];
    gcards.forEach(c => {
      const img = c.querySelector('img');
      const ok = () => img.classList.add('ok');
      img.complete && img.naturalWidth ? ok() : img.addEventListener('load', ok, { once: true });
    });

    document.querySelectorAll('.card img').forEach(img => img.addEventListener('error', () => {
      const m = img.closest('.media'); m.classList.add('noimg'); img.remove();
    }));
    const cards = [...track.children];
    const pars  = cards.map(c => c.querySelector('.par'));
    cards.forEach(c => {
      const img = c.querySelector('img');
      const ok = () => img.classList.add('ok');
      img.complete && img.naturalWidth ? ok() : img.addEventListener('load', ok, { once: true });
    });

    /* ── Révélation à l'entrée dans l'écran ── */
    const t0 = performance.now();
    const io = new IntersectionObserver(entries => {
      const first = performance.now() - t0 < 2800;
      let rank = 0;
      entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.left - b.boundingClientRect.left).forEach(e => {
        const c = e.target; io.unobserve(c);
        const d = (first ? 0.4 : 0) + rank++ * 0.055;
        c.style.setProperty('--rd', d + 's');
        c.classList.add('in');
        setTimeout(() => c.classList.add('done'), (d + 1.3) * 1000);
      });
    }, { root: rail, threshold: 0.08 });
    cards.forEach(c => io.observe(c));

    /* ── Géométrie mise en cache ── */
    let lefts = [], widths = [], maxScroll = 0;
    function measure() {
      lefts = cards.map(c => c.offsetLeft);
      widths = cards.map(c => c.offsetWidth);
      maxScroll = Math.max(0, rail.scrollWidth - rail.clientWidth);
    }
    new ResizeObserver(measure).observe(track);
    new ResizeObserver(measure).observe(rail);
    measure();

    /* ── Défilement fluide : molette verticale → horizontal, glisser, clavier ── */
    let view = 'rail';
    let tx = 0, cx = 0, lastSet = 0, running = false, lastT = 0, panelOpen = false;
    const setScroll = v => { lastSet = v; rail.scrollLeft = v; };

    function visuals() {
      if (view === 'grid') return;
      const sl = rail.scrollLeft, vw = rail.clientWidth, mid = sl + vw / 2;
      const p = maxScroll ? clamp(sl / maxScroll, 0, 1) : 0;
      bar.style.setProperty('--p', p.toFixed(4));
      document.body.style.setProperty('--bgx', (sl * 0.22).toFixed(1) + 'px');       // la trame glisse plus lentement que la bande
      let best = 0, bd = Infinity;
      for (let i = 0; i < N; i++) {
        const cc = lefts[i] + widths[i] / 2;
        const off = cc - mid;
        if (Math.abs(off) < bd) { bd = Math.abs(off); best = i; }
        if (cc + widths[i] < sl - 200 || cc - widths[i] > sl + vw + 200) continue;   // hors écran : pas de calcul
        pars[i].style.transform = 'translate3d(' + clamp(off * -0.03, -14, 14).toFixed(1) + 'px,0,0)';
      }
      const label = pad2(best + 1) + ' / ' + pad2(N);
      if (countEl.textContent !== label) {
        countEl.textContent = label;
        countEl.classList.remove('tick'); void countEl.offsetWidth; countEl.classList.add('tick');
      }
      if (sl > 8) document.body.classList.add('moved');
    }

    let prevCx = 0, sv = 0;
    function loop(now) {
      const dt = Math.min((now - lastT) / 1000 || 0.016, 0.05); lastT = now;
      const k = reduce ? 1 : 1 - Math.exp(-dt * 13);
      cx += (tx - cx) * k;
      if (Math.abs(tx - cx) < 0.3) cx = tx;
      setScroll(cx);
      // la bande se penche selon la vitesse puis revient en ressort : sensation d'élasticité
      const vel = cx - prevCx; prevCx = cx;
      sv = 0;
      track.style.transform = Math.abs(sv) > 0.02 ? 'skewX(' + sv.toFixed(2) + 'deg)' : '';
      visuals();
      if (cx !== tx || Math.abs(sv) > 0.02) requestAnimationFrame(loop); else running = false;
    }
    function kick() { if (!running) { running = true; lastT = performance.now(); prevCx = cx; requestAnimationFrame(loop); } }
    const to = v => { tx = clamp(v, 0, maxScroll); kick(); };

    rail.addEventListener('scroll', () => {                      // défilement natif (tactile, barre...) : on resynchronise
      if (Math.abs(rail.scrollLeft - lastSet) > 1.5) { tx = cx = rail.scrollLeft; lastSet = cx; }
      visuals();
    }, { passive: true });

    window.addEventListener('wheel', e => {
      if (panelOpen || view === 'grid' || e.ctrlKey) return;
      e.preventDefault();
      let d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (e.deltaMode === 1) d *= 32;
      to(tx + d);
    }, { passive: false });

    /* ── Aimant : quand le geste s'arrête, la bande se cale sur le projet le plus proche (ou le suivant si on a franchi un seuil) ── */
    let snapT = null, gStart = 0;
    const nearest = v => {
      const mid = v + rail.clientWidth / 2; let b = 0, bd = Infinity;
      for (let i = 0; i < N; i++) { const dd = Math.abs(lefts[i] + widths[i] / 2 - mid); if (dd < bd) { bd = dd; b = i; } }
      return b;
    };
    const snapNow = () => {
      snapT = null;
      if (panelOpen || drag) return;
      let i = nearest(tx);
      const startC = lefts[gStart] + widths[gStart] / 2 - rail.clientWidth / 2;
      if (i === gStart && Math.abs(tx - startC) > 36) i = clamp(gStart + (tx > startC ? 1 : -1), 0, N - 1);
      to(clamp(lefts[i] + widths[i] / 2 - rail.clientWidth / 2, 0, maxScroll));
    };
    const armSnap = (ms) => { clearTimeout(snapT); snapT = setTimeout(snapNow, ms || 130); };

    /* glisser à la souris */
    let drag = null, dragged = false;
    rail.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.cap')) return;
      gStart = nearest(tx);
      drag = { x: e.clientX, tx: tx };
    });
    window.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 6) dragged = true;
      if (dragged) to(drag.tx - dx);
    });
    const endDrag = () => { drag = null; setTimeout(() => dragged = false, 0); };
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    window.addEventListener('blur', endDrag);
    rail.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);

    const centerOn = (i, instant) => {
      if (view === 'grid') { gcards[i].scrollIntoView({ block: 'center' }); return; }
      const v = clamp(lefts[i] + widths[i] / 2 - rail.clientWidth / 2, 0, maxScroll);
      if (instant) { tx = cx = v; setScroll(v); visuals(); } else to(v);
    };

    /* ── Magnétisme : les cadres et les boutons sont attirés par le curseur (ressort avec léger dépassement) ── */
    const MAG = new Map(); let magRun = false;
    function magSet(el, t) {
      let m = MAG.get(el);
      if (!m) { m = { x: 0, y: 0, rx: 0, ry: 0, vx: 0, vy: 0, vrx: 0, vry: 0, t: { x: 0, y: 0, rx: 0, ry: 0 } }; MAG.set(el, m); }
      Object.assign(m.t, t);
      if (!magRun) { magRun = true; requestAnimationFrame(magLoop); }
    }
    function magLoop() {
      let busy = false;
      MAG.forEach((m, el) => {
        [['x', 'vx'], ['y', 'vy'], ['rx', 'vrx'], ['ry', 'vry']].forEach(([k, v]) => {
          m[v] = (m[v] + (m.t[k] - m[k]) * 0.14) * 0.74;
          m[k] += m[v];
          if (Math.abs(m[v]) > 0.01 || Math.abs(m.t[k] - m[k]) > 0.01) busy = true; else { m[k] = m.t[k]; m[v] = 0; }
        });
        el.style.transform = el.classList.contains('media')
          ? 'perspective(900px) translate3d(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px,0) rotateX(' + m.rx.toFixed(2) + 'deg) rotateY(' + m.ry.toFixed(2) + 'deg)'
          : 'translate3d(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px,0)';
      });
      if (busy) requestAnimationFrame(magLoop); else magRun = false;
    }
    const Z = { x: 0, y: 0, rx: 0, ry: 0 };
    let hov = null;
    if (!reduce && matchMedia('(hover: hover)').matches) {
      window.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse' || panelOpen) return;
        const m = drag && dragged ? null : e.target.closest && e.target.closest('.media');
        if (hov && hov !== m) { magSet(hov, Z); hov = null; }
        if (m) {
          const r = m.getBoundingClientRect();
          const rx = clamp((e.clientX - r.left) / r.width * 2 - 1, -1, 1), ry = clamp((e.clientY - r.top) / r.height * 2 - 1, -1, 1);
          magSet(m, { x: rx * 12, y: ry * 9, rx: -ry * 3.2, ry: rx * 3.2 });
          hov = m;
        }
      });
      [rail, gridEl].forEach(el => el.addEventListener('pointerleave', () => { if (hov) { magSet(hov, Z); hov = null; } }));
    }

    /* ── Fiche projet ── */
    const panel = document.getElementById('panel');
    const $ = id => document.getElementById(id);
    const inertEls = [document.querySelector('.site-header'), rail, gridEl, $('hud')];
    const cur_cards = () => view === 'grid' ? gcards : cards;
    let cur = 0, opener = null, closing = false;

    function fill(i) {
      const p = data[i];
      $('pn-meta').textContent = [p.client, p.annee, p.cadre].filter(Boolean).join('  ·  ');
      $('pn-t').textContent = p.titre;
      $('pn-lead').textContent = p.accroche;
      $('pn-text').innerHTML = p.texte.map(t => '<p>' + esc(t) + '</p>').join('');
      $('pn-liv').innerHTML = [p.disciplines.join(' / '), p.livrables.join(' / ')].filter(Boolean).map(esc).join('<br>');
      const img = $('pn-img');
      img.src = p.cover.src; img.alt = p.titre;
      img.className = p.cover.fit === 'contain' ? 'contain' : '';
      $('pn-n').textContent = pad2(i + 1) + ' / ' + pad2(N);
      $('pn-body').scrollTop = 0;
    }
    const insetOf = el => {
      const r = el.getBoundingClientRect();
      return 'inset(' + r.top + 'px ' + (innerWidth - r.right) + 'px ' + (innerHeight - r.bottom) + 'px ' + r.left + 'px)';
    };

    function openPanel(i) {
      if (panelOpen) return;
      cur = i; opener = cur_cards()[i].querySelector('.media');
      fill(i);
      panelOpen = true; closing = false;
      panel.hidden = false;
      inertEls.forEach(el => el.inert = true);
      panel.classList.remove('open', 'closing');
      panel.style.opacity = '';
      if (reduce) { panel.style.clipPath = 'inset(0 0 0 0)'; }
      else {
        panel.style.transition = 'none';
        panel.style.opacity = '';
        panel.style.clipPath = insetOf(opener);                      // part du cadre de l'image cliquée…
        void panel.offsetWidth;
        panel.style.transition = 'clip-path 0.5s var(--ease-out)';
        panel.style.clipPath = 'inset(0px 0px 0px 0px)';             // …et occupe tout l'écran
      }
      panel.classList.add('open');
      $('pn-close').focus({ preventScroll: true });
    }

    function closePanel() {
      if (!panelOpen || closing) return;
      closing = true;
      centerOn(cur, true);                                           // la carte courante est visible pour le retour
      opener = cur_cards()[cur].querySelector('.media');
      panel.classList.add('closing');
      const done = () => {
        panel.classList.remove('open', 'closing');
        panel.hidden = true; panelOpen = false; closing = false;
        inertEls.forEach(el => el.inert = false);
        opener.focus({ preventScroll: true });
      };
      if (reduce) { done(); return; }
      panel.style.transition = 'clip-path 0.35s var(--ease-out), opacity 0.15s ease 0.2s';
      panel.style.clipPath = insetOf(opener);
      panel.style.opacity = '0';
      let fired = false;
      const fin = () => { if (fired) return; fired = true; done(); };
      panel.addEventListener('transitionend', e => { if (e.target === panel) fin(); }, { once: true });
      setTimeout(fin, 500);
    }

    function go(d) {
      cur = (cur + d + N) % N;
      fill(cur);
      centerOn(cur, true);
      $('pn-body').querySelectorAll('.rv').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
    }

    gcols.addEventListener('click', e => {
      const m = e.target.closest('.media');
      if (m) openPanel(+m.closest('.card').dataset.i);
    });
    track.addEventListener('click', e => {
      const m = e.target.closest('.media');
      if (m) openPanel(+m.closest('.card').dataset.i);
    });
    $('pn-close').addEventListener('click', closePanel);
    $('pn-prev').addEventListener('click', () => go(-1));
    $('pn-next').addEventListener('click', () => go(1));

    window.addEventListener('keydown', e => {
      if (panelOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closePanel(); }
        else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
        else if (e.key === 'Tab') {                                  // le focus reste dans la fiche
          const f = [...panel.querySelectorAll('button')];
          const a = document.activeElement, first = f[0], last = f[f.length - 1];
          if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
        }
        return;
      }
      if (view === 'grid') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); to(tx + rail.clientWidth * 0.6); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); to(tx - rail.clientWidth * 0.6); }
      else if (e.key === 'Home') { e.preventDefault(); to(0); }
      else if (e.key === 'End')  { e.preventDefault(); to(maxScroll); }
    });

    /* ── Bascule Bande / Galerie ── */
    const vb = { rail: $('v-rail'), grid: $('v-grid') };
    const gio = new IntersectionObserver(entries => {
      let rank = 0;
      entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left).forEach(e => {
        const c = e.target; gio.unobserve(c);
        c.style.setProperty('--rd', (rank++ * 0.06) + 's');
        c.classList.add('in');
        setTimeout(() => c.classList.add('done'), 1300 + rank * 60);
      });
    }, { root: gridEl, threshold: 0.05 });
    function gridHud() {
      const max = gridEl.scrollHeight - gridEl.clientHeight;
      bar.style.setProperty('--p', (max > 0 ? clamp(gridEl.scrollTop / max, 0, 1) : 0).toFixed(4));
    }
    gridEl.addEventListener('scroll', gridHud, { passive: true });
    function setView(v, save) {
      if (v === view) return;
      view = v;
      document.body.classList.toggle('view-grid', v === 'grid');
      vb.rail.setAttribute('aria-pressed', v === 'rail');
      vb.grid.setAttribute('aria-pressed', v === 'grid');
      if (save) { try { localStorage.setItem('loicbp_view', v); } catch (e) {} }
      if (v === 'grid') {
        countEl.textContent = pad2(N) + ' projets';
        gcards.forEach(c => { c.classList.remove('in', 'done'); gio.observe(c); });
        gridEl.scrollTop = 0; gridHud();
      } else {
        countEl.textContent = '';
        measure(); visuals();
      }
    }
    vb.rail.addEventListener('click', () => setView('rail', true));
    vb.grid.addEventListener('click', () => setView('grid', true));
    try { if (localStorage.getItem('loicbp_view') === 'grid') setView('grid'); } catch (e) {}

    visuals();
  })();
  </script>
</body>
</html>
