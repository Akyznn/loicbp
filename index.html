<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lbp — maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg: #f5f5f3;
      --ink: #0f0f0f;
    }

    html, body {
      height: 100%;
      cursor: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Serif', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Curseur Mac OS Classic ── */
    #cursor {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      /* hotspot = pointe en haut à gauche */
      transform: translate(0px, 0px);
    }

    /* ── Follower ── */
    #follower {
      position: fixed;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--ink);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      opacity: 0.35;
      transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
    }

    body.hovering #follower {
      width: 42px;
      height: 42px;
      opacity: 0.12;
    }

    /* ── Layout ── */
    .container {
      text-align: center;
      padding: 2rem;
    }

    .label {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-style: italic;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .title-wrap {
      overflow: hidden;
      margin: 1.4rem 0 0.5rem;
    }

    .title {
      font-size: clamp(2rem, 7vw, 4.8rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      display: block;
      clip-path: inset(0 100% 0 0);
      animation: wipe 0.9s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.5s;
    }

    .title em { font-style: italic; }

    .clock-wrap {
      overflow: hidden;
      margin-bottom: 1.6rem;
    }

    .clock {
      font-size: clamp(4rem, 16vw, 11rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1;
      display: block;
      clip-path: inset(0 100% 0 0);
      animation: wipe 0.9s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.75s;
      font-variant-numeric: tabular-nums;
    }

    .clock .sep {
      font-style: italic;
      opacity: 0.3;
      animation: blink-sep 1s step-end infinite 1.5s;
    }

    .rule {
      width: 0;
      height: 1px;
      background: var(--ink);
      margin: 0 auto 1.6rem;
      animation: expand 0.6s ease forwards 1.2s;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.5s ease forwards 1.5s;
    }

    .links a {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.4em;
      font-style: italic;
      cursor: none;
      position: relative;
    }

    .links a::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s ease;
    }

    .links a:hover::after { width: 100%; }

    .links .divider {
      width: 1px; height: 12px;
      background: var(--ink);
      opacity: 0.25;
    }

    .icon-at { font-style: normal; font-size: 0.9em; opacity: 0.55; }

    @keyframes wipe    { to { clip-path: inset(0 0% 0 0); } }
    @keyframes expand  { to { width: 100%; } }
    @keyframes fadeUp  { to { opacity: 1; transform: translateY(0); } }
    @keyframes blink-sep {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.08; }
    }
  </style>
</head>
<body>

  <!--
    Curseur Mac OS Classic (System 1–6)
    Flèche 16×16 px, hotspot en (0,0)
    Dessinée pixel par pixel : contour blanc 1px + remplissage noir
  -->
  <svg id="cursor" width="16" height="21" viewBox="0 0 16 21" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Ombre / contour blanc -->
    <path d="
      M1 0
      L1 16
      L4 13
      L6.5 19.5
      L9.5 18.5
      L7 12
      L11 12
      Z
    " fill="white" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Corps noir -->
    <path d="
      M1 0
      L1 16
      L4 13
      L6.5 19.5
      L9.5 18.5
      L7 12
      L11 12
      Z
    " fill="#0f0f0f"/>
  </svg>

  <div id="follower"></div>

  <div class="container">
    <p class="label">Loic Bosse-Platière — loicbp.fr</p>

    <div class="title-wrap">
      <span class="title">maintenance</span>
    </div>

    <div class="clock-wrap">
      <span class="clock">
        <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span>
      </span>
    </div>

    <div class="rule"></div>

    <div class="links">
      <a href="https://instagram.com/l0icbp" target="_blank" rel="noopener">
        <span class="icon-at">@</span>l0icbp
      </a>
      <div class="divider"></div>
      <a href="mailto:contact@loicbp.fr">contact@loicbp.fr</a>
    </div>
  </div>

  <script>
    /* Horloge */
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('hh').textContent = pad(now.getHours());
      document.getElementById('mm').textContent = pad(now.getMinutes());
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* Curseur */
    const cursorEl  = document.getElementById('cursor');
    const follower  = document.getElementById('follower');
    let mx = -100, my = -100;
    let fx = -100, fy = -100;

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + 'px';
      cursorEl.style.top  = my + 'px';
    });

    (function animateFollower() {
      fx += (mx - fx) * 0.11;
      fy += (my - fy) * 0.11;
      follower.style.left = fx + 'px';
      follower.style.top  = fy + 'px';
      requestAnimationFrame(animateFollower);
    })();

    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>
</body>
</html>
