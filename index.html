<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site en maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f5f3;
      --ink: #0f0f0f;
      --gap: 2rem;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Syne Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    /* ── Ligne supérieure ── */
    .label {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    /* ── Titre principal ── */
    .title-wrap {
      overflow: hidden;
      margin: 1.6rem 0 1.2rem;
    }

    .title {
      font-size: clamp(1.6rem, 6vw, 3.8rem);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1;
      display: block;
      clip-path: inset(0 100% 0 0);
      animation: wipe 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.5s;
    }

    /* ── Ligne de séparation ── */
    .rule {
      width: 0;
      height: 1px;
      background: var(--ink);
      margin: 0 auto 1.4rem;
      animation: expand 0.6s ease forwards 1.1s;
    }

    /* ── Sous-texte ── */
    .sub {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 1.4s;
    }

    /* ── Cursor clignotant ── */
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--ink);
      vertical-align: text-bottom;
      margin-left: 4px;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 1.4s, blink 1s step-end infinite 1.9s;
    }

    /* ── Keyframes ── */
    @keyframes wipe {
      to { clip-path: inset(0 0% 0 0); }
    }

    @keyframes expand {
      to { width: 100%; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="label">Loïc Bosse-Platière — loicbp.fr</p>
    <div class="title-wrap">
      <span class="title">Site en maintenance</span>
    </div>
    <div class="rule"></div>
    <p class="sub">Bientôt disponible<span class="cursor"></span></p>
  </div>
</body>
</html>
