<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>lbp — maintenance</title>
  <link rel="canonical" href="https://loicbp.fr/" />
  <script src="analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Loic Bosse-Platière",
    "jobTitle": "Designer graphique",
    "url": "https://loicbp.fr/",
    "email": "mailto:contact@loicbp.fr",
    "sameAs": ["https://instagram.com/l0icbp"]
  }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg: #fdfdfd;
    --check-a: #fdfdfd;
    --check-b: #efefef;
    --check: 11px;      /* taille d'une case du damier */
    --trame: 720px;     /* largeur d'UNE occurrence de la trame (assets/trame.svg) */
    --trame-x: -30px;   /* décalage : la trame dépasse en haut à gauche */
    --trame-y: -20px;
      --ink: #0f0f0f;
    }

    html, body {
      height: 100%;
      cursor: none;
    }

    body {
      background-color: var(--check-a);
    background-image:
      url('assets/trame.svg?v=3'),
      conic-gradient(var(--check-b) 25%, var(--check-a) 0 50%, var(--check-b) 0 75%, var(--check-a) 0);
    /* une seule trame par bloc de 2×2 : vide autour (haut/bas/gauche/droite ET diagonales) de la taille du SVG */
    background-size:
      calc(var(--trame) * 2) auto,
      calc(var(--check) * 2) calc(var(--check) * 2);
    background-position:
      var(--trame-x) var(--trame-y),
      0 0;
    background-repeat: repeat, repeat;
      color: var(--ink);
      font-family: 'Piazzolla', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Curseur main (PNG) ── */
    #cursor {
      position: fixed;
      top: 0; left: 0;
      width: 32px;
      height: auto;
      pointer-events: none;
      z-index: 9999;
      /* hotspot = bout de l'index (≈ 5px, 1px) */
      transform: translate(-5px, -1px);
      will-change: left, top;
    }

    /* ── Follower ── */
    #follower {
      position: fixed;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--ink);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      opacity: 0.35;
      transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
    }

    body.hovering #follower {
      width: 42px;
      height: 42px;
      opacity: 0.12;
    }

    /* ── Layout ── */
    .container {
      text-align: center;
      padding: 2rem;
    }

    .label {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-style: italic;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .title-wrap {
      overflow: hidden;
      margin: 1.4rem 0 0.5rem;
    }

    .title {
      font-size: clamp(2rem, 7vw, 4.8rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1;
      display: block;
      clip-path: inset(0 100% 0 0);
      animation: wipe 0.9s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.5s;
    }

    .title em { font-style: italic; }

    .clock-wrap {
      overflow: hidden;
      margin-bottom: 1.6rem;
    }

    .clock {
      font-size: clamp(4rem, 16vw, 11rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1;
      display: block;
      clip-path: inset(0 100% 0 0);
      animation: wipe 0.9s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.75s;
      font-variant-numeric: tabular-nums;
    }

    .clock .sep {
      font-style: italic;
      opacity: 0.3;
      animation: blink-sep 1s step-end infinite 1.5s;
    }

    .rule {
      width: 0;
      height: 1px;
      background: var(--ink);
      margin: 0 auto 1.6rem;
      animation: expand 0.6s ease forwards 1.2s;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.5s ease forwards 1.5s;
    }

    .links a {
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.4em;
      font-style: italic;
      cursor: none;
      position: relative;
    }

    .links a::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s ease;
    }

    .links a:hover::after { width: 100%; }

    .links .divider {
      width: 1px; height: 12px;
      background: var(--ink);
      opacity: 0.25;
    }

    .icon-at { font-style: normal; font-size: 0.9em; opacity: 0.55; }

    /* ── Bouton Toolbox ── */
    .toolbox-link {
      position: fixed;
      top: clamp(1rem, 2.5vw, 1.8rem);
      right: clamp(1rem, 2.5vw, 1.8rem);
      z-index: 10;
      font-size: clamp(0.6rem, 1vw, 0.72rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      font-style: italic;
      color: var(--ink);
      cursor: none;
      padding: 0.5em 0;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.5s ease forwards 1.7s;
    }

    .toolbox-link::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s ease;
    }

    .toolbox-link:hover::after,
    .toolbox-link:focus-visible::after { width: 100%; }

    /* Écrans tactiles : pas de curseur custom */
    @media (hover: none) {
      html, body, .links a, .toolbox-link { cursor: auto; }
      #cursor, #follower { display: none; }
    }

    @keyframes wipe    { to { clip-path: inset(0 0% 0 0); } }
    @keyframes expand  { to { width: 100%; } }
    @keyframes fadeUp  { to { opacity: 1; transform: translateY(0); } }
    @keyframes blink-sep {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.08; }
    }
  </style>
</head>
<body>

  <img id="cursor" src="assets/curseur-main.png" alt="" width="32" height="30" aria-hidden="true" />

  <div id="follower"></div>

  <a class="toolbox-link" href="toolbox.html" data-umami-event="clic-toolbox">Toolbox</a>

  <div class="container">
    <p class="label">Loic Bosse-Platière — loicbp.fr</p>

    <div class="title-wrap">
      <span class="title">maintenance</span>
    </div>

    <div class="clock-wrap">
      <span class="clock">
        <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span>
      </span>
    </div>

    <div class="rule"></div>

    <div class="links">
      <a href="https://instagram.com/l0icbp" target="_blank" rel="noopener" data-umami-event="clic-instagram">
        <span class="icon-at">@</span>l0icbp
      </a>
      <div class="divider"></div>
      <a href="mailto:contact@loicbp.fr" data-umami-event="clic-email">contact@loicbp.fr</a>
    </div>
  </div>

  <script>
    /* Horloge */
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('hh').textContent = pad(now.getHours());
      document.getElementById('mm').textContent = pad(now.getMinutes());
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* Curseur */
    const cursorEl  = document.getElementById('cursor');
    const follower  = document.getElementById('follower');
    let mx = -100, my = -100;
    let fx = -100, fy = -100;

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + 'px';
      cursorEl.style.top  = my + 'px';
    });

    (function animateFollower() {
      fx += (mx - fx) * 0.11;
      fy += (my - fy) * 0.11;
      follower.style.left = fx + 'px';
      follower.style.top  = fy + 'px';
      requestAnimationFrame(animateFollower);
    })();

    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>
</body>
</html>
